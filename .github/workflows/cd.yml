name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Déploiement sur le VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clé SSH de déploiement
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # La clé ne peut lancer que scripts/deploy.sh (forced command)
      - name: Déploiement
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST"

  notify:
    name: Alerte Slack
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Message d'échec
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          python3 - <<'EOF'
          import json
          import os
          import urllib.request

          env = os.environ
          run_url = (
              f"{env['GITHUB_SERVER_URL']}/{env['GITHUB_REPOSITORY']}"
              f"/actions/runs/{env['GITHUB_RUN_ID']}"
          )
          message = "\n".join(
              [
                  "*Échec du déploiement EcoShop en production*",
                  f"Commit : `{env['GITHUB_SHA'][:7]}`",
                  f"Détails : {run_url}",
              ]
          )
          request = urllib.request.Request(
              env["SLACK_WEBHOOK_URL"],
              data=json.dumps({"text": message}).encode(),
              headers={"Content-Type": "application/json"},
          )
          urllib.request.urlopen(request, timeout=30)
          EOF
