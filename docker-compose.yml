name: ecoshop

services:

  # Entrepôt de données (raw, staging, marts...)
  warehouse:
    image: postgres:16
    container_name: ecoshop-warehouse
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${WAREHOUSE_USER}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD}
      POSTGRES_DB: ${WAREHOUSE_DB}
    ports:
      - "${WAREHOUSE_PORT}:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_USER} -d ${WAREHOUSE_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Base interne de Lightdash
  lightdash-db:
    image: postgres:16
    container_name: ecoshop-lightdash-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LIGHTDASH_DB_USER}
      POSTGRES_PASSWORD: ${LIGHTDASH_DB_PASSWORD}
      POSTGRES_DB: ${LIGHTDASH_DB_NAME}
    volumes:
      - lightdash_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LIGHTDASH_DB_USER} -d ${LIGHTDASH_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Stockage S3 pour Lightdash (sans authentification : pas de port exposé)
  s3:
    image: chrislusf/seaweedfs:4.00
    container_name: ecoshop-s3
    restart: unless-stopped
    command: "server -s3 -dir=/data"
    volumes:
      - s3_data:/data

  # Crée le bucket Lightdash puis s'arrête
  s3-init:
    image: amazon/aws-cli:2.27.0
    container_name: ecoshop-s3-init
    depends_on:
      - s3
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws --endpoint-url http://s3:8333 s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null \
           || aws --endpoint-url http://s3:8333 s3 mb "s3://$$S3_BUCKET"; do
          echo "En attente du stockage S3..."; sleep 2
        done
        echo "Bucket $$S3_BUCKET prêt."

  # BI
  lightdash:
    image: lightdash/lightdash:3.361.0
    container_name: ecoshop-lightdash
    restart: unless-stopped
    depends_on:
      lightdash-db:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    environment:
      PGHOST: lightdash-db
      PGPORT: 5432
      PGUSER: ${LIGHTDASH_DB_USER}
      PGPASSWORD: ${LIGHTDASH_DB_PASSWORD}
      PGDATABASE: ${LIGHTDASH_DB_NAME}
      LIGHTDASH_SECRET: ${LIGHTDASH_SECRET}
      SITE_URL: ${SITE_URL}
      PORT: 8080
      SECURE_COOKIES: "false"  # "true" en production (HTTPS)
      TRUST_PROXY: "false"
      # S3 (SeaweedFS en local)
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: "true"
    ports:
      - "${LIGHTDASH_PORT}:8080"

  # Airflow (profil "airflow") :
  #   docker compose --profile airflow up -d --build

  # Base de métadonnées d'Airflow
  airflow-db:
    image: postgres:16
    container_name: ecoshop-airflow-db
    profiles: ["airflow"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: ecoshop-airflow:3.3.2
    container_name: ecoshop-airflow
    profiles: ["airflow"]
    restart: unless-stopped
    command: standalone
    depends_on:
      airflow-db:
        condition: service_healthy
      warehouse:
        condition: service_healthy
    environment:
      # Airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      # Le rendu Cosmos (dbt ls) dépasse les 30 s par défaut
      AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "180"
      AIRFLOW__DAG_PROCESSOR__DAG_FILE_PROCESSOR_TIMEOUT: "240"
      # Local uniquement : interface sans authentification
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      # Projet EcoShop
      ECOSHOP_HOME: /opt/ecoshop
      ECOSHOP_VENV: /opt/ecoshop-venv
      # dbt et script d'alertes
      DBT_TARGET: dev
      DBT_HOST: warehouse
      DBT_PORT: "5432"
      WAREHOUSE_USER: ${WAREHOUSE_USER}
      WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD}
      WAREHOUSE_DB: ${WAREHOUSE_DB}
      # dlt (priment sur .dlt/secrets.toml)
      DESTINATION__POSTGRES__CREDENTIALS__HOST: warehouse
      DESTINATION__POSTGRES__CREDENTIALS__PORT: "5432"
      DESTINATION__POSTGRES__CREDENTIALS__DATABASE: ${WAREHOUSE_DB}
      DESTINATION__POSTGRES__CREDENTIALS__USERNAME: ${WAREHOUSE_USER}
      DESTINATION__POSTGRES__CREDENTIALS__PASSWORD: ${WAREHOUSE_PASSWORD}
      # Alertes Slack
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - ./:/opt/ecoshop
    ports:
      - "${AIRFLOW_PORT:-8082}:8080"

volumes:
  warehouse_data:
  lightdash_data:
  s3_data:
  airflow_db_data:
  airflow_logs:
