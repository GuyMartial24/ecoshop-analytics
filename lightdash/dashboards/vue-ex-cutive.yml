    w: 17
    x: 0
    "y": 1
  - h: 1
    properties:
      content: >
        **Suivi du pipeline quotidien** (ingestion dlt puis transformations
        dbt).

        Les avertissements sur `commune_code` concernent des communes DVF ayant
        changé de code

        depuis la vente : ils sont connus et sans impact sur les indicateurs.

        Une alerte est envoyée sur Slack (#data-alerts) à chaque anomalie.
      hideFrame: true
      title: ""
