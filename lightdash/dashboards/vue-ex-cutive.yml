contentType: dashboard
description: |2
   Pilotage EcoShop : ventes, carte de France (e-commerce et marché immobilier DVF), clients et qualité des données.
filters:
  dimensions: []
  metrics: []
  tableCalculations: []
name: EcoShop Analytics
parameters: {}
slug: vue-ex-cutive
spaceSlug: shared/ecoshop
tabs:
