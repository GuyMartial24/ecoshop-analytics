    slug: clients-et-r-tention
  - hidden: false
    name: Qualité et fraîcheur
    order: 3
    slug: qualit-et-fra-cheur
tiles:
  - h: 1
    properties:
      content: >
        **Sources** : commandes EcoShop (commune du client au moment de l'achat)
        et ventes immobilières

        DVF 2024-2025 des départements de Paris (75), du Rhône (69) et de la
        Gironde (33).

        Prix au m² : ventes d'un seul appartement ou d'une seule maison, hors
        prix aberrants,

        communes d'au moins 20 ventes.
      hideFrame: true
      title: ""
    tabSlug: cartographie-france
    type: markdown
    w: 28
    x: 0
    "y": 0
  - h: 1
    properties:
      content: >
        **Segments** : Standard, Premium et VIP. Le segment **actuel** décrit le
        portefeuille aujourd'hui ;

        le segment **à la commande** retrace l'historique d'achat (historique
        SCD2).

        Les indicateurs ne comptent que les commandes expédiées ou livrées.
      hideFrame: true
      title: ""
    tabSlug: clients-et-r-tention
    type: markdown
    w: 26
    x: 0
    "y": 0
  - h: 1
    properties:
      content: >
        **Périmètre** : commandes expédiées ou livrées depuis janvier 2025,
        montants après remise.

        La marge est calculée sur le chiffre d'affaires HT (TVA 20 %). Le mois
        en cours est incomplet (pointillés).

        Les segments sont ceux du client **au moment de la commande**.
      hideFrame: true
      title: "À propos de cet onglet "
    tabSlug: vue-ex-cutive
    type: markdown
    w: 24
    x: 0
    "y": 0
