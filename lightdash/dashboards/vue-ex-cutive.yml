    properties:
      chartName: CA par commune
      chartSlug: ca-par-commune
      hideTitle: false
      title: ""
    tabSlug: cartographie-france
    tileSlug: ca-par-commune
    type: saved_chart
    w: 14
    x: 0
    "y": 1
  - h: 6
