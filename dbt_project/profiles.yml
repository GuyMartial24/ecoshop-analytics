# Profil de connexion dbt. Aucun secret ici : tout est lu dans les variables
# d'environnement (fichier .env en local, secrets GitHub en CI, Airflow sur le VPS).
ecoshop:
  target: dev
  outputs:

    # Développement local : dbt tourne sur le poste, l'entrepôt est dans Docker
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_PORT', env_var('WAREHOUSE_PORT', '5433')) | as_number }}"
      user: "{{ env_var('WAREHOUSE_USER') }}"
      password: "{{ env_var('WAREHOUSE_PASSWORD') }}"
      dbname: "{{ env_var('WAREHOUSE_DB') }}"
      schema: analytics
      threads: 4

    # Intégration continue : schémas isolés par PR (ex. ci_pr_12_staging)
    ci:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_PORT', '5432') | as_number }}"
      user: "{{ env_var('WAREHOUSE_USER') }}"
      password: "{{ env_var('WAREHOUSE_PASSWORD') }}"
      dbname: "{{ env_var('WAREHOUSE_DB') }}"
      schema: "{{ env_var('DBT_CI_SCHEMA', 'ci') }}"
      threads: 4

    # Production (VPS) : dbt s'exécute dans le réseau Docker, à côté de l'entrepôt
    prod:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'warehouse') }}"
      port: "{{ env_var('DBT_PORT', '5432') | as_number }}"
      user: "{{ env_var('WAREHOUSE_USER') }}"
      password: "{{ env_var('WAREHOUSE_PASSWORD') }}"
      dbname: "{{ env_var('WAREHOUSE_DB') }}"
      schema: analytics
      threads: 4

# Profil lu par la CLI Elementary (edr) : même entrepôt, schéma des tables d'observabilité
elementary:
  target: default
  outputs:
    default:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_PORT', env_var('WAREHOUSE_PORT', '5433')) | as_number }}"
      user: "{{ env_var('WAREHOUSE_USER') }}"
      password: "{{ env_var('WAREHOUSE_PASSWORD') }}"
      dbname: "{{ env_var('WAREHOUSE_DB') }}"
      schema: elementary
      threads: 4
