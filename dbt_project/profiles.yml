# Identifiants lus dans les variables d'environnement
ecoshop:
  target: dev
  outputs:

    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_PORT', env_var('WAREHOUSE_PORT', '5433')) | as_number }}"
      user: "{{ env_var('WAREHOUSE_USER') }}"
      password: "{{ env_var('WAREHOUSE_PASSWORD') }}"
      dbname: "{{ env_var('WAREHOUSE_DB') }}"
      schema: analytics
      threads: 4
      sslmode: disable  # PostgreSQL local sans SSL

    # CI : schémas préfixés par DBT_CI_SCHEMA
    ci:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_PORT', '5432') | as_number }}"
      user: "{{ env_var('WAREHOUSE_USER') }}"
      password: "{{ env_var('WAREHOUSE_PASSWORD') }}"
      dbname: "{{ env_var('WAREHOUSE_DB') }}"
      schema: "{{ env_var('DBT_CI_SCHEMA', 'ci') }}"
      threads: 4

    # Connexion enregistrée dans Lightdash (depuis son conteneur)
    lightdash:
      type: postgres
      host: warehouse
      port: 5432
      user: "{{ env_var('WAREHOUSE_USER') }}"
      password: "{{ env_var('WAREHOUSE_PASSWORD') }}"
      dbname: "{{ env_var('WAREHOUSE_DB') }}"
      schema: analytics
      threads: 4
      sslmode: disable

    # Production (VPS)
    prod:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'warehouse') }}"
      port: "{{ env_var('DBT_PORT', '5432') | as_number }}"
      user: "{{ env_var('WAREHOUSE_USER') }}"
      password: "{{ env_var('WAREHOUSE_PASSWORD') }}"
      dbname: "{{ env_var('WAREHOUSE_DB') }}"
      schema: analytics
      threads: 4
      sslmode: disable  # réseau Docker interne

# Profil utilisé par la CLI Elementary (edr)
elementary:
  target: default
  outputs:
    default:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_PORT', env_var('WAREHOUSE_PORT', '5433')) | as_number }}"
      user: "{{ env_var('WAREHOUSE_USER') }}"
      password: "{{ env_var('WAREHOUSE_PASSWORD') }}"
      dbname: "{{ env_var('WAREHOUSE_DB') }}"
      schema: elementary
      threads: 4
