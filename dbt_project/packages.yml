# Paquets dbt externes, installés dans dbt_packages/ par `dbt deps`.
# Les versions exactes résolues sont figées dans package-lock.yml (versionné).
packages:
  - package: dbt-labs/dbt_utils
    version: [">=1.3.0", "<2.0.0"]

  # Observabilité : historise les résultats des runs et des tests dans le schéma
  # elementary (lus ensuite par la CLI edr pour le rapport et les alertes Slack)
  - package: elementary-data/elementary
    version: [">=0.20.0", "<1.0.0"]
