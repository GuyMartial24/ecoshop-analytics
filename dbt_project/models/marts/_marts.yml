version: 2

models:

  # Dimensions

  - name: dim_communes
    description: Communes et arrondissements municipaux avec département, région, population et coordonnées GPS.
    columns:
      - name: commune_code
        description: Code INSEE.
        data_tests:
          - unique
          - not_null
      - name: latitude
        data_tests:
          - not_null
      - name: longitude
        data_tests:
          - not_null

  - name: dim_products
    description: Catalogue produits avec prix TTC et HT, coût et marge unitaire.
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
      - name: list_price_incl_vat
        data_tests:
          - positive_value
      - name: unit_cost
        data_tests:
          - positive_value
      - name: unit_margin
        description: Marge unitaire au prix catalogue (HT - coût) ; aucun produit n'est vendu à perte hors remise.
        data_tests:
          - positive_value:
              arguments:
                allow_zero: true

  - name: dim_customers
    description: >
      Clients dans leur état courant, rattachés à leur commune, avec leurs indicateurs
      de cycle de vie (commandes comptées dans le CA). Aucune donnée personnelle directe
      (email, nom complet) n'est exposée.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: customer_segment
        data_tests:
          - accepted_values:
              arguments:
                values: ["Standard", "Premium", "VIP"]
      - name: commune_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_communes')
                field: commune_code

  - name: dim_customers_history
    description: >
      Dimension client historisée (SCD de type 2), construite sur le snapshot
      snap_customers : une ligne par version d'un client, valide sur [valid_from, valid_to[.
      La version courante a valid_to = 9999-12-31.
    columns:
      - name: customer_version_id
        description: Clé de substitution de la version (customer_id + valid_from).
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: commune_code
        description: Commune du client pendant la période de validité de la version.
        data_tests:
          - not_null
      - name: is_current
        description: Vrai pour la version en vigueur aujourd'hui (une seule par client).

  # Faits

  - name: fct_orders
    description: >
      Commandes avec montants (TTC, HT), coût et marge. Une ligne par commande.
      Matérialisation incrémentale (merge sur order_id). Le segment et la commune sont
      ceux du client à la date de la commande (jointure temporelle sur dim_customers_history).
    config:
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns: [order_id]
    data_tests:
      # Volume de commandes par jour comparé aux 30 jours précédents
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: ordered_at
            time_bucket: {period: day, count: 1}
            training_period: {period: day, count: 30}
            detection_period: {period: day, count: 2}
          config:
            severity: warn
    columns:
      - name: order_id
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: customer_id
        data_type: bigint
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: customer_version_id
        data_type: text
        description: Version du client en vigueur à la date de la commande.
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers_history')
                field: customer_version_id
      - name: customer_segment_at_order
        data_type: varchar
        description: Segment du client au moment de la commande.
      - name: commune_code
        data_type: varchar
        description: Commune du client au moment de la commande.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_communes')
                field: commune_code
      - name: order_date
        data_type: date
        constraints:
          - type: not_null
      - name: ordered_at
        data_type: timestamptz
      - name: updated_at
        data_type: timestamptz
      - name: order_status
        data_type: varchar
        constraints:
          - type: not_null
      - name: order_status_label
        data_type: varchar
      - name: is_revenue
        data_type: boolean
        description: Vrai si la commande compte dans le chiffre d'affaires (expédiée ou livrée).
      - name: is_final
        data_type: boolean
      - name: item_count
        data_type: bigint
      - name: total_quantity
        data_type: bigint
      - name: gross_amount_incl_vat
        data_type: numeric(14, 2)
      - name: discount_amount
        data_type: numeric(14, 2)
      - name: net_amount_incl_vat
        data_type: numeric(14, 2)
        description: Chiffre d'affaires TTC après remise.
      - name: net_amount_excl_vat
        data_type: numeric(14, 2)
        description: Chiffre d'affaires HT après remise.
      - name: cost_amount
        data_type: numeric(14, 2)
      - name: margin_amount
        data_type: numeric(14, 2)
        description: Marge = CA HT - coût d'achat.

  - name: fct_order_items
    description: Lignes de commande valorisées. Une ligne par article.
    columns:
      - name: order_item_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: quantity
        data_tests:
          - positive_value

  - name: fct_dvf_sales
    description: >
      Ventes immobilières DVF, une ligne par vente. Le prix au m² n'est renseigné que
      pour les ventes de référence (vente simple d'un seul logement) ; filtrer
      is_price_outlier = false pour les moyennes.
    columns:
      - name: mutation_id
        data_tests:
          - unique
          - not_null
      - name: commune_code
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_communes')
                field: commune_code
              config:
                severity: warn   # communes ayant changé de code depuis la vente
      - name: price_per_m2
        data_tests:
          # Les ventes à 1 euro sont déjà signalées comme aberrantes
          - positive_value:
              config:
                where: "not is_price_outlier"
