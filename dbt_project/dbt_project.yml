name: ecoshop
version: "1.0.0"
profile: ecoshop

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]

clean-targets:
  - target
  - dbt_packages

# Surchargeables avec --vars
vars:
  vat_rate: 0.20                # TVA (prix catalogue TTC)
  dvf_min_price_per_m2: 1000    # bornes du prix au m² DVF
  dvf_max_price_per_m2: 25000
  orders_lookback_days: 3       # rattrapage de fct_orders (incrémental)

# Un schéma par couche (voir macros/generate_schema_name.sql)
models:
  ecoshop:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

  elementary:
    +schema: elementary

seeds:
  ecoshop:
    +schema: seeds

# Requis par Elementary
flags:
  require_explicit_package_overrides_for_builtin_materializations: false
  source_freshness_run_project_hooks: true
